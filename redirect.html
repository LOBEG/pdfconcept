<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=REDIRECT_URL_HERE">
    <title>Redirecting…</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .stage {
            width: 100%;
            max-width: 360px;
            padding: 32px 28px;
            text-align: center;
            animation: stageIn 0.4s ease-out both;
        }

        @keyframes stageIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Simple spinner ── */
        .spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 22px;
            border: 2.5px solid #eef0f3;
            border-top-color: #1473e6;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Title & status ── */
        .title {
            font-size: 17px;
            font-weight: 600;
            color: #111;
            letter-spacing: -0.2px;
            margin-bottom: 6px;
        }

        .status {
            font-size: 13px;
            color: #6b7280;
            min-height: 20px;
            margin-bottom: 22px;
        }

        /* ── Animated status text (no JS required) ── */
        .status-text {
            position: relative;
            display: inline-block;
            min-width: 110px;
            height: 18px;
            vertical-align: middle;
            text-align: center;
        }

        .status-text > span {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            opacity: 0;
            animation: statusCycle 3s linear forwards;
        }

        .status-text > span:nth-child(1) { animation-delay: 0s;     }
        .status-text > span:nth-child(2) { animation-delay: 0.75s;  }
        .status-text > span:nth-child(3) { animation-delay: 1.5s;   }
        .status-text > span:nth-child(4) { animation-delay: 2.25s;  }

        @keyframes statusCycle {
            0%   { opacity: 0; }
            1%   { opacity: 1; }
            24%  { opacity: 1; }
            25%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Last label stays visible until redirect */
        .status-text > span:nth-child(4) {
            animation-name: statusCycleLast;
        }

        @keyframes statusCycleLast {
            0%   { opacity: 0; }
            1%   { opacity: 1; }
            100% { opacity: 1; }
        }

        .status .dots::after {
            content: '';
            display: inline-block;
            width: 14px;
            text-align: left;
            animation: dots 1.4s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* ── Progress bar (kept) ── */
        .progress {
            position: relative;
            height: 3px;
            background: #f1f3f5;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1473e6, #4ea3ff);
            border-radius: 2px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fillBar 3s linear forwards;
        }

        @keyframes fillBar {
            0%   { width: 0%; }
            25%  { width: 30%; }
            50%  { width: 65%; }
            75%  { width: 90%; }
            100% { width: 100%; }
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            animation: shimmer 1.4s linear infinite;
        }

        @keyframes shimmer {
            from { transform: translateX(-100%); }
            to   { transform: translateX(40px); }
        }

        /* ── No-JS fallback ── */
        .nojs {
            display: none;
            margin-top: 20px;
            font-size: 12px;
            color: #6b7280;
        }

        .nojs a {
            color: #1473e6;
            text-decoration: none;
            font-weight: 500;
        }

        .nojs a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="stage" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>

        <h1 class="title">Just a moment</h1>
        <p class="status">
            <span class="status-text" id="statusLabel" aria-live="polite">
                <span>Connecting</span>
                <span>Verifying</span>
                <span>Almost there</span>
                <span>Redirecting</span>
            </span><span class="dots" aria-hidden="true"></span>
        </p>

        <div class="progress" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <noscript>
            <p class="nojs" style="display:block">
                Not redirected automatically?
                <a href="REDIRECT_URL_HERE">Continue</a>
            </p>
        </noscript>
    </main>

    <script>
        (function () {
            var redirectUrl = 'REDIRECT_URL_HERE';
            // Visuals (progress bar + status text) are driven entirely by CSS
            // so they work even if this script never runs. JS only handles the
            // final navigation, mirroring the 3s CSS animation timeline.
            setTimeout(function () {
                window.location.href = redirectUrl;
            }, 3000);
        })();
    </script>
</body>
</html>
