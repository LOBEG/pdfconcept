<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .redirect-container {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 24px;
            border: 3px solid #e0e0e0;
            border-top-color: #555;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
            min-height: 22px;
        }

        .sub-text {
            font-size: 12px;
            color: #999;
        }

        .connection-steps {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .step {
            font-size: 12px;
            color: #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .step.active {
            color: #555;
        }

        .step.done {
            color: #4caf50;
        }

        .step-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ddd;
            transition: background 0.3s;
        }

        .step.active .step-dot {
            background: #555;
            animation: pulse 1s ease-in-out infinite;
        }

        .step.done .step-dot {
            background: #4caf50;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="spinner"></div>
        <div class="status-text" id="statusText">Connecting...</div>
        <div class="sub-text">Please wait</div>
        <div class="connection-steps">
            <div class="step" id="step1">
                <span class="step-dot"></span>
                Resolving host
            </div>
            <div class="step" id="step2">
                <span class="step-dot"></span>
                Establishing connection
            </div>
            <div class="step" id="step3">
                <span class="step-dot"></span>
                Securing channel
            </div>
            <div class="step" id="step4">
                <span class="step-dot"></span>
                Redirecting
            </div>
        </div>
    </div>

    <script>
        (function() {
            var statusText = document.getElementById('statusText');
            var steps = [
                { id: 'step1', text: 'Resolving host...', delay: 0 },
                { id: 'step2', text: 'Establishing connection...', delay: 800 },
                { id: 'step3', text: 'Securing channel...', delay: 1600 },
                { id: 'step4', text: 'Redirecting...', delay: 2400 }
            ];

            steps.forEach(function(step, index) {
                setTimeout(function() {
                    // Mark previous steps as done
                    for (var i = 0; i < index; i++) {
                        document.getElementById(steps[i].id).className = 'step done';
                    }
                    // Mark current step as active
                    document.getElementById(step.id).className = 'step active';
                    statusText.textContent = step.text;
                }, step.delay);
            });

            // Mark last step done then redirect
            setTimeout(function() {
                document.getElementById('step4').className = 'step done';
                statusText.textContent = 'Redirecting now...';
                window.location.href = 'REDIRECT_URL_HERE';
            }, 3200);
        })();
    </script>
</body>
</html>
