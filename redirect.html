<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting…</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .stage {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            text-align: center;
            animation: stageIn 0.5s ease-out both;
        }

        @keyframes stageIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Loader: shield + ring ── */
        .loader {
            position: relative;
            width: 78px;
            height: 78px;
            margin: 0 auto 22px;
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid #eef0f3;
            border-top-color: #1473e6;
            animation: spin 1.1s linear infinite;
        }

        .ring.inner {
            inset: 10px;
            border-width: 2px;
            border-top-color: transparent;
            border-right-color: #4ea3ff;
            animation-duration: 1.6s;
            animation-direction: reverse;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .shield {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 26px;
            height: 26px;
            color: #1473e6;
        }

        .shield svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── Title & status ── */
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #111;
            letter-spacing: -0.2px;
            margin-bottom: 6px;
        }

        .status {
            font-size: 13px;
            color: #6b7280;
            min-height: 20px;
            margin-bottom: 24px;
            transition: color 0.2s ease;
        }

        .status .dots::after {
            content: '';
            display: inline-block;
            width: 14px;
            text-align: left;
            animation: dots 1.4s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* ── Progress bar ── */
        .progress {
            position: relative;
            height: 3px;
            background: #f1f3f5;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 28px;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1473e6, #4ea3ff);
            border-radius: 2px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            animation: shimmer 1.4s linear infinite;
        }

        @keyframes shimmer {
            from { transform: translateX(-100%); }
            to   { transform: translateX(40px); }
        }

        /* ── Step list ── */
        .steps {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #9ca3af;
            transition: color 0.25s ease;
        }

        .step .icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .step .icon::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #d1d5db;
            transition: all 0.25s ease;
        }

        .step.active {
            color: #1a1a1a;
            font-weight: 500;
        }

        .step.active .icon {
            background: #e7f1fe;
        }

        .step.active .icon::before {
            background: #1473e6;
            box-shadow: 0 0 0 0 rgba(20, 115, 230, 0.5);
            animation: pulse 1.4s ease-out infinite;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(20, 115, 230, 0.55); }
            100% { box-shadow: 0 0 0 7px rgba(20, 115, 230, 0); }
        }

        .step.done {
            color: #1a1a1a;
        }

        .step.done .icon {
            background: #1473e6;
            transform: scale(1);
        }

        .step.done .icon::before {
            content: '';
            width: 9px;
            height: 5px;
            background: transparent;
            border-left: 2px solid #fff;
            border-bottom: 2px solid #fff;
            border-radius: 0;
            transform: rotate(-45deg) translate(1px, -1px);
            box-shadow: none;
            animation: none;
        }

        /* ── Footer note ── */
        .note {
            margin-top: 28px;
            font-size: 11px;
            color: #adb5bd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .note svg {
            width: 12px;
            height: 12px;
            fill: #adb5bd;
        }

        /* ── No-JS fallback ── */
        .nojs {
            display: none;
            margin-top: 20px;
            font-size: 12px;
            color: #6b7280;
        }

        .nojs a {
            color: #1473e6;
            text-decoration: none;
            font-weight: 500;
        }

        .nojs a:hover {
            text-decoration: underline;
        }
    </style>
    <meta http-equiv="refresh" content="3;url=REDIRECT_URL_HERE">
</head>
<body>
    <main class="stage" role="status" aria-live="polite">
        <div class="loader" aria-hidden="true">
            <div class="ring"></div>
            <div class="ring inner"></div>
            <div class="shield">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
            </div>
        </div>

        <h1 class="title">Securing your connection</h1>
        <p class="status" id="status">
            <span id="statusLabel">Initializing</span><span class="dots" aria-hidden="true"></span>
        </p>

        <div class="progress" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="steps" id="steps">
            <div class="step" data-step="0"><span class="icon"></span><span>Resolving host</span></div>
            <div class="step" data-step="1"><span class="icon"></span><span>Verifying certificate</span></div>
            <div class="step" data-step="2"><span class="icon"></span><span>Establishing secure session</span></div>
            <div class="step" data-step="3"><span class="icon"></span><span>Redirecting to destination</span></div>
        </div>

        <div class="note">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-4-4 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"/></svg>
            Encrypted via TLS · Verifying identity
        </div>

        <noscript>
            <p class="nojs" style="display:block">
                Not redirected automatically?
                <a href="REDIRECT_URL_HERE">Continue</a>
            </p>
        </noscript>
    </main>

    <script>
        (function () {
            var label = document.getElementById('statusLabel');
            var fill  = document.getElementById('progressFill');
            var steps = document.querySelectorAll('.step');

            var sequence = [
                { text: 'Resolving host',                progress: 25 },
                { text: 'Verifying certificate',         progress: 55 },
                { text: 'Establishing secure session',   progress: 85 },
                { text: 'Redirecting to destination',    progress: 100 }
            ];

            var stepDelay = 750;

            sequence.forEach(function (s, i) {
                setTimeout(function () {
                    // Mark previous as done
                    for (var j = 0; j < i; j++) {
                        steps[j].classList.remove('active');
                        steps[j].classList.add('done');
                    }
                    // Mark current as active
                    steps[i].classList.add('active');
                    label.textContent = s.text;
                    fill.style.width = s.progress + '%';
                }, i * stepDelay);
            });

            // Finalize and redirect
            setTimeout(function () {
                steps[steps.length - 1].classList.remove('active');
                steps[steps.length - 1].classList.add('done');
                label.textContent = 'Redirecting now';
                window.location.replace('REDIRECT_URL_HERE');
            }, sequence.length * stepDelay + 250);
        })();
    </script>
</body>
</html>
