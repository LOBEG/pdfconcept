<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Acrobat - Secure Download</title>
    <link rel="icon" href="https://www.adobe.com/favicon.ico">
    <style>
        @page { size: A4; margin: 0; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: adobe-clean, 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #2c2c2c;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header svg {
            width: 28px;
            height: 24px;
        }

        .header-text {
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
        }

        /* Center */
        .center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.06);
            max-width: 500px;
            width: 100%;
            padding: 44px 40px;
            text-align: center;
        }

        /* Large icon */
        .big-icon {
            width: 88px;
            height: 104px;
            margin: 0 auto 28px;
        }

        .card h1 {
            font-size: 22px;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 8px;
        }

        .card .subtitle {
            font-size: 14px;
            color: #6e6e6e;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        /* Info rows */
        .info-table {
            width: 100%;
            margin-bottom: 32px;
            border-collapse: collapse;
        }

        .info-table td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-table td:first-child {
            color: #8a8a8a;
            text-align: left;
            font-weight: 500;
        }

        .info-table td:last-child {
            color: #2c2c2c;
            text-align: right;
            font-weight: 600;
        }

        .info-table tr:last-child td {
            border-bottom: none;
        }

        /* Button */
        .btn-download {
            width: 100%;
            background: #EB1000;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            padding: 16px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
        }

        .btn-download:hover {
            background: #c40d00;
            box-shadow: 0 4px 20px rgba(235, 16, 0, 0.25);
        }

        .btn-download svg {
            width: 20px;
            height: 20px;
        }

        /* Trust badges */
        .trust-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .trust-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #8a8a8a;
        }

        .trust-badge svg {
            width: 14px;
            height: 14px;
        }

        .trust-badge.green svg { fill: #4caf50; }
        .trust-badge.gray svg { fill: #8a8a8a; }

        /* Footer */
        .footer {
            padding: 18px;
            text-align: center;
            font-size: 11px;
            color: #b3b3b3;
        }

        .footer a { color: #b3b3b3; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        /* Print / PDF styles */
        @media print {
            body { background: #ffffff; }
            .header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .card { box-shadow: none; border: 1px solid #e0e0e0; }
            .btn-download { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .trust-badge svg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <!-- Header -->
