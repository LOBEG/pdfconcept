<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }

        .container {
            max-width: 480px;
            width: 100%;
            padding: 0 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
        }

        /* Status bar */
        .status-bar {
            background: #334155;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 11px;
            color: #22c55e;
            font-weight: 600;
        }

        /* Card body */
        .card-body {
            padding: 36px 28px;
        }

        .doc-visual {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            padding: 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .doc-icon {
            width: 56px;
            height: 68px;
            flex-shrink: 0;
        }

        .doc-info {
            flex: 1;
            min-width: 0;
        }

        .doc-name {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-meta {
            font-size: 12px;
            color: #64748b;
        }

        .doc-size-bar {
            width: 100%;
            height: 3px;
            background: #334155;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .doc-size-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 2px;
        }

        /* Details grid */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .detail-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px 16px;
        }

        .detail-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* Download button */
        .btn-download {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-download::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 2s ease infinite;
        }

        @keyframes shimmer {
            to { left: 100%; }
        }

        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
        }

        .btn-download svg {
            width: 18px;
            height: 18px;
        }

        /* Security info */
        .security-info {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: #475569;
        }

        .security-info svg {
            width: 14px;
            height: 14px;
            fill: #475569;
        }

        /* Footer */
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Status bar -->
            <div class="status-bar">
                <div class="status-left">
                    <div class="status-dot"></div>
                    <span class="status-text">Document processed</span>
                </div>
                <span class="status-badge">Ready</span>
            </div>

            <!-- Card body -->
            <div class="card-body">
                <!-- Document visual -->
                <div class="doc-visual">
                    <svg class="doc-icon" viewBox="0 0 56 68" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 4C0 1.79 1.79 0 4 0H36L56 20V64C56 66.21 54.21 68 52 68H4C1.79 68 0 66.21 0 64V4Z" fill="#1e293b" stroke="#475569" stroke-width="1"/>
                        <path d="M36 0L56 20H40C37.79 20 36 18.21 36 16V0Z" fill="#334155"/>
                        <rect x="10" y="36" rx="2" width="36" height="4" fill="#334155"/>
                        <rect x="10" y="44" rx="2" width="28" height="4" fill="#334155"/>
                        <rect x="10" y="52" rx="2" width="32" height="4" fill="#334155"/>
                        <text x="28" y="30" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700" font-family="sans-serif">PDF</text>
                    </svg>
                    <div class="doc-info">
                        <div class="doc-name">Confidential_Report.pdf</div>
                        <div class="doc-meta">PDF Document &middot; Protected</div>
                        <div class="doc-size-bar">
                            <div class="doc-size-fill"></div>
                        </div>
                    </div>
                </div>

                <!-- Details grid -->
                <div class="details-grid">
                    <div class="detail-box">
                        <div class="detail-label">File Size</div>
                        <div class="detail-value">5.1 MB</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label">Pages</div>
                        <div class="detail-value">18</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label">Format</div>
                        <div class="detail-value">PDF 2.0</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label">Encryption</div>
                        <div class="detail-value">AES-256</div>
                    </div>
                </div>

                <!-- Download button -->
                <button class="btn-download">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download Secure Document
                </button>

                <div class="security-info">
                    <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
                    End-to-end encrypted transfer
                </div>
            </div>
        </div>

        <div class="footer-text">
            Secure Document Delivery &middot; Files are automatically deleted after 24 hours
        </div>
    </div>
</body>
</html>
